name: 墨墨每日进度
on:
  schedule:
    - cron: '0 0 * * *'   # 北京时间 8:00
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python maimemo_standalone.py progress
        env:
          MAIMEMO_TOKEN: ${{ secrets.MAIMEMO_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
