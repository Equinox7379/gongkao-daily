name: 哲学每日金句

on:
  schedule:
    - cron: '30 23 * * *'  # 北京时间7:30
  workflow_dispatch:

jobs:
  philosophy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python philosophy.py
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
